<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encuesta sobre el nuevo régimen tributario para comerciantes de ferias libres establecido por la Ley N.º 21.745 – Universidad de Santiago de Chile.">
  <meta name="theme-color" content="#065f46">
  <title>Encuesta Ferias Libres | USACH</title>

  <!-- Tailwind CSS (CDN de producción) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts – Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50:'#ecfdf5', 100:'#d1fae5', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* ── Transición de pasos ── */
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step-animate { animation: stepIn 0.35s ease forwards; }

    /* ── Tarjetas de opción ── */
    .option-card {
      display: flex; flex-direction: column;
      padding: 0.5rem 0.7rem;
      border-radius: 0.625rem;
      border: 1.5px solid #e2e8f0;
      cursor: pointer;
      transition: border-color .15s, background-color .15s, box-shadow .15s;
      user-select: none;
    }
    @media (min-width: 640px) {
      .option-card {
        padding: 0.875rem 1.125rem;
        border-radius: 0.875rem;
        border-width: 2px;
      }
    }
    .option-card:hover { border-color: #6ee7b7; background-color: #f0fdf4; }
    .option-card.selected {
      border-color: #059669;
      background-color: #ecfdf5;
      box-shadow: 0 0 0 2px rgba(5,150,105,.12);
    }

    /* ── Indicador radio ── */
    .radio-dot {
      flex-shrink: 0;
      width: 1rem; height: 1rem;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background-color .15s;
    }
    @media (min-width: 640px) {
      .radio-dot { width: 1.125rem; height: 1.125rem; }
    }
    .radio-dot.checked { border-color: #059669; background-color: #059669; }
    .radio-dot.checked::after { content:''; width:.35rem; height:.35rem; border-radius:50%; background:white; }

    /* ── Indicador checkbox ── */
    .check-box {
      flex-shrink: 0;
      width: 1rem; height: 1rem;
      border-radius: .25rem;
      border: 2px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background-color .15s;
    }
    @media (min-width: 640px) {
      .check-box { width: 1.125rem; height: 1.125rem; border-radius: .3rem; }
    }
    .check-box.checked { border-color: #059669; background-color: #059669; }
    .check-box.checked::after {
      content: '';
      width: .45rem; height: .3rem;
      border-left: 2px solid white; border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
    }

    /* ── Barra de progreso ── */
    .progress-fill { transition: width .45s cubic-bezier(.4,0,.2,1); }

    /* ── Toast ── */
    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast { animation: toastSlide .3s ease forwards; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #6ee7b7; border-radius: 2px; }

    /* Selects y inputs base */
    select, input[type="text"], textarea {
      appearance: none;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 text-[13px] sm:text-base">

  <!-- ══════════════════ CABECERA ULTRA COMPACTA ══════════════════ -->
  <header class="bg-gradient-to-r from-brand-800 via-brand-700 to-teal-700 text-white shadow-sm sticky top-0 z-30">
    <!-- Botón de acceso administradoras (esquina superior derecha) -->
    <a href="admin.html" id="admin-access-btn"
       class="absolute top-2 right-2.5 sm:top-3.5 sm:right-4 z-10
              flex items-center gap-1 px-2 py-0.5 sm:px-3 sm:py-1 rounded-md sm:rounded-xl
              bg-white/10 backdrop-blur-sm border border-white/15
              text-white/80 text-[10px] sm:text-xs font-medium
              hover:bg-white/20 hover:text-white
              active:scale-95 transition-all"
       title="Panel de Administración">
      <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <span class="hidden sm:inline">Admin</span>
    </a>

    <div class="max-w-2xl mx-auto px-3 py-2 sm:py-5 flex items-center justify-start sm:justify-center sm:flex-col gap-2 sm:gap-1.5 text-left sm:text-center">
      <div class="flex-shrink-0 inline-flex items-center justify-center w-7 h-7 sm:w-11 sm:h-11 rounded-lg sm:rounded-xl bg-white/15 backdrop-blur-sm shadow-sm">
        <svg class="w-4 h-4 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
      </div>
      <div class="pr-7 sm:pr-0 min-w-0">
        <h1 class="text-xs sm:text-xl font-bold leading-tight truncate sm:whitespace-normal">
          Encuesta a comerciantes de ferias libres
        </h1>
        <p class="text-brand-200 text-[10px] sm:text-xs font-normal">
          Contador Público y Auditor · USACH
        </p>
      </div>
    </div>
  </header>

  <!-- ══════════════════ CONTENIDO PRINCIPAL ══════════════════ -->
  <main class="max-w-2xl mx-auto px-2.5 sm:px-4 pt-2.5 sm:pt-5 pb-16 sm:pb-24" id="main-content">

    <!-- Barra de progreso (oculta en welcome/thanks) -->
    <div id="progress-section" class="hidden mb-2.5 sm:mb-4">
      <div class="flex justify-between items-center mb-0.5">
        <span class="text-[9px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wide">Progreso</span>
        <span id="progress-label" class="text-[11px] sm:text-sm font-bold text-brand-700">0%</span>
      </div>
      <div class="h-1.5 sm:h-2.5 bg-slate-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="progress-fill h-full rounded-full
             bg-gradient-to-r from-brand-500 to-teal-400" style="width:0%"></div>
      </div>
      <p id="step-label" class="text-[9px] sm:text-xs text-slate-400 mt-0.5 text-right"></p>
    </div>

    <!-- Contenedor de pasos (renderizado dinámicamente) -->
    <div id="step-container">
      <!-- Spinner inicial mientras carga Firebase -->
      <div class="flex flex-col items-center justify-center py-12 sm:py-20 gap-2.5">
        <div class="w-7 h-7 sm:w-10 sm:h-10 border-2 sm:border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-slate-400 text-xs sm:text-sm">Cargando encuesta…</p>
      </div>
    </div>

  </main>

  <!-- ══════════════════ BARRA DE NAVEGACIÓN INFERIOR ══════════════════ -->
  <footer id="nav-footer"
    class="hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-slate-200 px-2.5 py-1.5 sm:px-4 sm:py-3 z-40 shadow-lg">
    <div class="max-w-2xl mx-auto flex items-center gap-2 sm:gap-3">
      <button id="btn-prev" onclick="window.__survey.prevStep()"
        class="flex items-center gap-1 px-3 py-1.5 sm:px-5 sm:py-2.5 rounded-lg sm:rounded-xl border border-slate-200
               text-slate-600 font-semibold text-[11px] sm:text-sm hover:bg-slate-50 active:scale-95
               transition-all duration-150 disabled:opacity-40">
        <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
        Anterior
      </button>
      <button id="btn-next" onclick="window.__survey.nextStep()"
        class="flex-1 flex items-center justify-center gap-1.5 py-2 sm:py-3.5 rounded-lg sm:rounded-xl
               bg-brand-600 text-white font-bold text-[11px] sm:text-sm
               hover:bg-brand-700 active:scale-95 transition-all duration-150
               shadow-sm shadow-brand-800/20">
        <span id="btn-next-label">Siguiente</span>
        <svg id="btn-next-icon" class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- Toast de validación -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- ══════════════════ MÓDULO JS ══════════════════ -->
  <script type="module" src="js/survey.js?v=9"></script>

</body>
</html>
